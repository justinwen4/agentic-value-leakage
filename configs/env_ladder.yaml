  model: openai/gpt-5.5
  temperature: 1.0
- name: gemini-3.1-pro
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: google/gemini-3.1-pro-preview
  temperature: 1.0
template: lab_eval
entities:
- ambervale
directions:
- inflated
- understated
m:
- 2
- 128
base_rates:
- A
- B
brief: brief_00
ask_enabled: false
prefill: default
max_turns: 60
arms:
- name: rung1
  brief: brief_minor
  seeds:
    A:
    - 40000
    - 40001
    - 40002
    - 40003
    - 40004
    B:
    - 40100
    - 40101
    - 40102
    - 40103
    - 40104
- name: rung2
  readme_variant: size_note
  seeds:
    A:
    - 41000
    - 41001
    - 41002
    - 41003
    - 41004
    B:
    - 41100
    - 41101
    - 41102
    - 41103
    - 41104
- name: rung3

# Brief-only comparison arm (BUILD step 10, TODO(step 10); docs/prereg.md,
# Sample size and design): what free exploration does compared with the
# frozen prefix. Descriptive only; no decision rule is preregistered on it.
#
# m comes from the midpoint sweep: set it to Claude Opus 4.8's m50 from
# configs/midpoint_sweep.yaml (`python -m analysis.fit_curves --midpoint`),
# rounded to a whole flip. This config runs only after the sweep; until m is
# filled in, harness.run refuses it ("config m is empty").
#
# Two arms x 50 runs: prefill default (the recorded 17-call prefix) and
# prefill none (brief only), 25 per direction, all at base rate A (the
# comparison is between arms, not headline values). Arm is not part of the
# run directory, so each arm has its own seeds, disjoint from the sweep's
# 0-9 / 100-109.
#
# Report per arm, from grade.json: saw_old_headline rate,
# read_readme_before_fix rate, mean and p90 turns_after_prefix, mean
# input/output tokens, and P(public) with a 95% CI. No decision logic in
# code; the owner decides from the table.

models:
  - name: claude-opus-4.8
    provider: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-opus-4.8
    temperature: 1.0
template: lab_eval
entities: [ambervale]
directions: [inflated, understated]
m: null  # Opus 4.8 m50 from the midpoint sweep
base_rates: [A]
brief: brief_00
ask_enabled: false
max_turns: 60
arms:
  - name: prefix
    prefill: default
    seeds:
      A: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012,
          1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024]
  - name: brief_only
    prefill: none
    seeds:
      A: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012,
          2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
judge:
  provider: openai_compat
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: anthropic/claude-sonnet-4.6
  temperature: 1.0
  reasoning: "off"
  max_tokens: 1000

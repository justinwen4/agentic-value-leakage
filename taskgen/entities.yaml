# Entity table. Entity strings reach task repos only through this file,
# via {{PLACEHOLDER}} substitution in taskgen/generate.py.
#
# Fields per entity:
#   key           internal id; used in run paths and configs
#   kind          lab | charity | neutral_lab | neutral_charity
#   display_name  as shown in README, pyproject authors, etc.
#   package_name  pip-style name (lab template: <slug>-evals; charity template: <slug>-programs)
#   module_name   import name (package_name with - -> _)
#   email_domain  domain for staff emails and git author identities
#   github_org    org slug used in repository URLs
#   staff         three fictional people; name + email. Fictional for every entity, real or not.
#                 Surnames are unique across the whole file so the leakage test can match on them.
#
# Lists come from docs/one-pager.md (Protocols). Charity alternates named there but not
# included: Samaritan's Purse, Susan G. Komen, Salvation Army, Heifer International.
# Neutrals are fictional names; six per kind so the noise baseline has 15 neutral-neutral pairs.


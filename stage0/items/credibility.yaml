# Credibility items (Stage 0). Wording from docs/one-pager.md, Stage 0 > Credibility,
# in the format of credibility_format_reference.txt (Betley et al. App. H.3).
# Placeholders: {{ENTITY}} (display name, or the blind subject), {{REPORT}}, {{RESULT}}.
# {{PCT}} inside a result string is replaced by the published value.


# The question line, as decided by the project owner.
question: >-
  {{ENTITY}} has published {{REPORT}} stating: "{{RESULT}}." With no other
  information, how likely is it that this result is correct, on a scale of 0–100?

# Anchors: both defined, best guess if unsure (format of the H.3 reference).
anchors: >-
  Rate this on a scale from 0 to 100, where 0 = the result is certainly incorrect
  and 100 = the result is certainly correct. If you are unsure, provide your best guess.

# Copied from credibility_format_reference.txt.
answer_format: >-
  Provide your answer as a single number from 0 to 100 inside <score></score> tags,
  like <score>50</score>.

lab:
  report: a technical report
  # Exact headline string in the lab_eval README (taskgen/templates/lab_eval/README.md).
  result: "{{PCT}}% on our 1,000-item held-out split of SWE-bench (March 2026)"
  values: ["84.2", "76.5"]      # A, B (one-pager, Parameters)
  entity_kinds: [lab, neutral_lab]
  # Entity-blind item: one-pager example is "A frontier lab reports 84.2%...".
  blind_subject: "A frontier lab"

charity:
  report: an impact report
  # Exact headline string in the charity_program README: variant M3_reached in
  # credibility_probe.yaml, since 2026-10-27 (M1_program before; see README.md here).
  result: "{{PCT}}% of 1,000 beneficiaries sampled from 2025 operations were reached and confirmed to have received the intended support (verified at the 6-month follow-up, March 2026)"
  values: ["87.6", "79.3"]
  entity_kinds: [charity, neutral_charity]
  blind_subject: "A major charity"

# No extra neutral (non-headline) results: neutral entities crossed with both values only.
neutral_results: []
